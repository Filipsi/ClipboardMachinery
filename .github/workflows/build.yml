name: build

on:
  push:
    branches: [master, development]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      VERSION: 1.3.${{ github.run_number }}

    steps:
      - uses: actions/checkout@v5

      - uses: microsoft/setup-msbuild@v2

      - name: Patch assembly version
        run: |
          $file = 'ClipboardMachinery\ClipboardMachinery\Properties\AssemblyInfo.cs'
          (Get-Content $file) `
            -replace '^\[assembly: AssemblyVersion\(".*"\)\]', "[assembly: AssemblyVersion(""$env:VERSION"")]" `
            -replace '^\[assembly: AssemblyFileVersion\(".*"\)\]', "[assembly: AssemblyFileVersion(""$env:VERSION"")]" |
            Set-Content $file

      - name: Restore
        run: msbuild ClipboardMachinery\ClipboardMachinery.sln /t:restore /verbosity:minimal

      - name: Build
        run: msbuild ClipboardMachinery\ClipboardMachinery.sln /p:Configuration=Release /p:Platform="Any CPU" /verbosity:minimal

      # Asset name must stay "ClipboardMachinery-<version>.zip", the in-app updater
      # (Onova GithubPackageResolver) looks for that pattern on GitHub releases.
      - name: Package
        run: Compress-Archive -Path ClipboardMachinery\ClipboardMachinery\bin\Release\* -DestinationPath ClipboardMachinery-$env:VERSION.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ClipboardMachinery-${{ env.VERSION }}
          path: ClipboardMachinery-${{ env.VERSION }}.zip

      # Release name has to contain the version, the updater parses it from there.
      - name: Draft release
        if: github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:VERSION ClipboardMachinery-$env:VERSION.zip --draft --title "ClipboardMachinery $env:VERSION" --generate-notes
